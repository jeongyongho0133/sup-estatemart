<!DOCTYPE html>
<html>
  <head>

      input { width: 80%; padding: 10px; margin-bottom: 10px; }

      <input type="text" placeholder="예: 강남역 푸르지오">
      <br>
      <button onclick="alert('곧 AI 상담 기능이 연결됩니다!')">상담 시작</button>
